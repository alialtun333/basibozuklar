name: basibozuklar_v1
description: "Başıbozuklar"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.4
  connectivity_plus: ^6.0.0
  url_launcher: ^6.3.0
  upgrader: ^11.3.0
  http: ^1.2.0
  ota_update: ^6.0.0
  package_info_plus: ^8.3.1 # Kotlin 2.0.21 uyumlu sürüm eklendi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/orman.jpg
    - assets/images/logo.png
    - assets/images/ana_ekran.png
    - assets/images/Uygulama_logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Uygulama_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  image: "assets/images/ana_ekran.png"
  android: true
  ios: true
  android_12:
    color: "#000000"
    image: "assets/images/ana_ekran.png"